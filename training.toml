schema_version = 2
id = "python-for-systems-programming"
title = "Python for systems programming"
content_language = "en"
summary = """
Python is a very versatile programming language that has a wide range of applications. This training concentrates on interaction with the operating system, the file system, other applications and the network. This is useful for systems programming, but also when you want to use Python as a coordination language for your workflows. This training introduces modules that are useful in that context.
"""
languages = ["Python"]

[[learning_outcomes]]
statement = "Know how to write scripts that handle command line arguments, configuration files and environment variables."
competencies = ["systems-programming.configuration-driven-cli-scripts"]

[[learning_outcomes]]
statement = "Know how to log information or errors from your applications."
competencies = ["systems-programming.application-logging"]

[[learning_outcomes]]
statement = "Be able to perform file system-related tasks."
competencies = ["systems-programming.filesystem-automation"]

[[learning_outcomes]]
statement = "Be able to use a templating library for reporting."
competencies = ["systems-programming.generate-reports-from-templates"]

[[learning_outcomes]]
statement = "Be able to interact with processes on a Linux system."
competencies = ["systems-programming.interact-with-processes"]

[[learning_outcomes]]
statement = "Be able to interact with remote systems using SSH."
competencies = ["systems-programming.automate-remote-systems-with-ssh"]

[[learning_outcomes]]
statement = "Be able to interact with compressed files."
competencies = ["systems-programming.process-compressed-files"]

[source]
metadata_document = "docs/README.md"
repository_url = "https://github.com/gjbex/Python-for-systems-programming/"
website_url = "https://gjbex.github.io/Python-for-systems-programming/"
license = "CC-BY-4.0"

[delivery]
duration_minutes = 240
duration_kind = "fixed"
session_count = 1
target_session_duration_minutes = 240
schedule_complete = true
description = """
Total duration: 4 hours.
"""

[audience]
description = """
This training is for you if you need to use Python for scripting and coordination of processes.
"""

[prerequisites]
summary = """
You will need experience programming in Python. This is not a training that starts from scratch. If you plan to do Python programming in a Linux or HPC environment you should be familiar with these as well. More concretely, participants should already be comfortable with the following: * running Python code in Jupyter or from the command line; * variables, numbers, strings, booleans, and basic containers such as lists, tuples, and dictionaries; * `if`/`else` statements, `for` loops, and simple comprehensions; * writing and calling functions with arguments and return values; * importing modules and using functions, classes, and constants from them; * reading and writing small text files using `open(...)`; * basic exception handling with `try`/`except`; * working with paths and file names at a basic level; * reading short Python scripts without needing every line explained. You do not need prior experience with `argparse`, `configparser`, logging, Jinja2, `subprocess`, `psutil`, AsyncSSH, Hydra, FastAPI, or binary/XML/CSV parsing libraries beyond the Python basics. Those are part of the training itself.
"""
competencies = ["python.run-code", "python.values-and-containers", "python.control-flow-and-comprehensions", "python.functions", "python.import-modules", "python.file-io", "python.exceptions", "python.paths-and-file-names"]

[self_assessment]
introduction = """
If you can do most of the tasks below without looking up basic Python syntax, you are likely ready for this training.
"""
tasks = [
  "Write a function that reads a text file and counts the number of lines.",
  "Use `if`/`else` and a loop to filter or transform file names.",
  "Import a module such as `pathlib`, `os`, `json`, or `csv` and use one of its basic features.",
  "Define a small script that accepts one or two command-line arguments.",
  "Read a short script that opens files, loops over records, and prints a result.",
  "Build a dictionary from a few key-value pairs and retrieve one by key.",
  "Make a small change to an existing script, run it again, and interpret the output.",
  "Read a short traceback or error message and identify roughly where the problem occurred."
]

[requirements]
software = [
  "Laptop or desktop with internet access.",
  "A Python environment that can run Jupyter Lab if you want to use your own system.",
  "Access to Google Colaboratory if you prefer not to install software."
]

[level]
introductory_percent = 20
intermediate_percent = 60
advanced_percent = 20
description = """
For participants who already have basic Python programming experience, the material in this training is approximately These percentages describe the level of the systems programming and scripting topics covered in the training, not the required entry level in Python itself.
"""

